<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WOLMIC Women's Month Welcome Screen</title>

<style>

/* =========================================================
   GENERAL SETTINGS
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    position:relative;
    color:#fff;

    background:linear-gradient(
        -45deg,
        #3d1638,
        #6b245d,
        #a23b72,
        #d85c9c,
        #f2a7c6,
        #f7d9e6,
        #d7a8d8,
        #8d4c8d,
        #4a1744
    );

    background-size:500% 500%;

    animation:gradientShift 25s ease infinite;
}


/* =========================================================
   ANIMATED BACKGROUND GRADIENT
========================================================= */

@keyframes gradientShift{

    0%{
        background-position:0% 50%;
    }

    50%{
        background-position:100% 50%;
    }

    100%{
        background-position:0% 50%;
    }

}


/* =========================================================
   CENTRAL SOFT GLOW
========================================================= */

.glow{
    position:absolute;

    width:65vw;
    height:65vw;

    max-width:1000px;
    max-height:1000px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    background:
        radial-gradient(
            circle,
            rgba(255,230,240,.55),
            rgba(255,174,210,.30),
            rgba(207,121,180,.18),
            transparent 70%
        );

    z-index:0;

    animation:glowPulse 8s ease-in-out infinite;
}

@keyframes glowPulse{

    0%,
    100%{
        opacity:.7;
        transform:translate(-50%,-50%) scale(1);
    }

    50%{
        opacity:1;
        transform:translate(-50%,-50%) scale(1.15);
    }

}


/* =========================================================
   LARGE BACKGROUND FLOWERS
========================================================= */

.bg-flower{
    position:absolute;

    font-size:7vw;

    opacity:.15;

    z-index:1;

    pointer-events:none;

    animation:bgFlowerFloat 15s ease-in-out infinite;
}

.bg-flower.f1{
    top:15%;
    left:8%;
}

.bg-flower.f2{
    top:18%;
    right:10%;

    animation-delay:3s;
}

.bg-flower.f3{
    bottom:12%;
    left:12%;

    animation-delay:6s;
}

.bg-flower.f4{
    bottom:10%;
    right:8%;

    animation-delay:9s;
}

@keyframes bgFlowerFloat{

    0%,
    100%{
        transform:translateY(0) rotate(0deg);
    }

    50%{
        transform:translateY(-40px) rotate(30deg);
    }

}


/* =========================================================
   FALLING FLOWERS / PETALS
========================================================= */

.petal{
    position:absolute;

    font-size:2vw;

    z-index:3;

    opacity:.75;

    pointer-events:none;

    animation:
        petalFall linear infinite;
}


/* Individual falling flowers */

.petal1{
    left:5%;
    top:-10%;

    animation-duration:13s;
}

.petal2{
    left:15%;
    top:-20%;

    animation-duration:17s;
    animation-delay:2s;
}

.petal3{
    left:27%;
    top:-15%;

    animation-duration:15s;
    animation-delay:4s;
}

.petal4{
    left:40%;
    top:-20%;

    animation-duration:19s;
    animation-delay:1s;
}

.petal5{
    left:52%;
    top:-15%;

    animation-duration:14s;
    animation-delay:5s;
}

.petal6{
    left:65%;
    top:-20%;

    animation-duration:18s;
    animation-delay:3s;
}

.petal7{
    left:77%;
    top:-10%;

    animation-duration:16s;
    animation-delay:6s;
}

.petal8{
    left:90%;
    top:-15%;

    animation-duration:20s;
    animation-delay:2s;
}

@keyframes petalFall{

    0%{
        transform:
            translateY(-10vh)
            translateX(0)
            rotate(0deg);

        opacity:0;
    }

    10%{
        opacity:.8;
    }

    50%{
        transform:
            translateY(55vh)
            translateX(8vw)
            rotate(360deg);
    }

    100%{
        transform:
            translateY(115vh)
            translateX(-6vw)
            rotate(720deg);

        opacity:0;
    }

}


/* =========================================================
   BACKGROUND SCROLLING WELCOME
========================================================= */

.bg-scroll{
    position:absolute;

    top:50%;
    left:0;

    transform:translateY(-50%);

    width:100%;

    overflow:hidden;

    z-index:2;

    pointer-events:none;
}

.bg-scroll-track{
    display:flex;

    width:max-content;

    animation:bgScroll 220s linear infinite;
}

.bg-scroll-track span{

    font-size:28vw;

    font-weight:900;

    color:transparent;

    -webkit-text-stroke:
        2px white;

    text-stroke:
        2px rgba(255,228,168,0.18);

    white-space:nowrap;

    padding-right:6vw;

    line-height:1;

    text-transform:uppercase;
}

@keyframes bgScroll{

    from{
        transform:translateX(0);
    }

    to{
        transform:translateX(-50%);
    }

}


/* =========================================================
   HEADER
   LOGO + CHURCH NAME
========================================================= */

.header{

    position:absolute;

    top:1.5vh;
    left:1.5vw;

    display:flex;

    align-items:center;

    gap:1vw;

    z-index:50;

    max-width:97vw;
}


/* =========================================================
   LOGO FLOWER FRAME
========================================================= */

.logo-flower-frame{

    position:relative;

    width:180px;
    height:145px;

    flex-shrink:0;

    display:flex;

    align-items:center;

    justify-content:center;

    isolation:isolate;

    animation:
        logoFloat 5s ease-in-out infinite;
}

@keyframes logoFloat{

    0%,
    100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-8px);
    }

}


/* =========================================================
   CHURCH LOGO
========================================================= */

.logo{

    position:relative;

    width:130px;
    height:125px;

    object-fit:contain;

    z-index:20;

    filter:
        drop-shadow(
            0 0 10px
            rgba(255,255,255,.9)
        )

        drop-shadow(
            0 0 25px
            rgba(255,182,193,.8)
        );
}


/* =========================================================
   FLOWERS SURROUNDING LOGO
========================================================= */

.logo-flower{

    position:absolute;

    font-size:2.4vw;

    z-index:8;

    pointer-events:none;

    filter:
        drop-shadow(
            0 0 8px
            rgba(255,255,255,.8)
        );

    animation:
        flowerFloat 4s ease-in-out infinite,
        flowerRotate 10s linear infinite;
}


/* TOP LEFT */

.flower1{

    top:-5px;
    left:0;

    animation-delay:0s;
}


/* TOP RIGHT */

.flower2{

    top:-10px;
    right:0;

    animation-delay:1s;
}


/* BOTTOM LEFT */

.flower3{

    bottom:-5px;
    left:0;

    animation-delay:2s;
}


/* BOTTOM RIGHT */

.flower4{

    bottom:-8px;
    right:0;

    animation-delay:3s;
}


/* LEFT SIDE */

.flower5{

    top:50%;
    left:-18px;

    transform:translateY(-50%);

    animation-delay:1.5s;
}


/* RIGHT SIDE */

.flower6{

    top:50%;
    right:-18px;

    transform:translateY(-50%);

    animation-delay:2.5s;
}


@keyframes flowerFloat{

    0%,
    100%{
        transform:translateY(0) scale(1);
    }

    50%{
        transform:translateY(-7px) scale(1.12);
    }

}


@keyframes flowerRotate{

    from{
        rotate:0deg;
    }

    to{
        rotate:360deg;
    }

}


/* =========================================================
   SPARKLES AROUND LOGO
========================================================= */

.logo-sparkle{

    position:absolute;

    color:#fff6c9;

    font-size:1.3vw;

    z-index:15;

    pointer-events:none;

    animation:
        sparkle 1.8s ease-in-out infinite alternate;
}


.spark1{
    top:0;
    left:45%;
}

.spark2{
    right:-5px;
    top:20%;

    animation-delay:.5s;
}

.spark3{
    left:-5px;
    bottom:20%;

    animation-delay:1s;
}

.spark4{
    bottom:0;
    left:50%;

    animation-delay:1.4s;
}

@keyframes sparkle{

    from{
        opacity:.2;

        transform:
            scale(.5)
            rotate(0deg);
    }

    to{
        opacity:1;

        transform:
            scale(1.6)
            rotate(180deg);
    }

}


/* =========================================================
   CHURCH NAME
========================================================= */

.name{

    font-size:3.5vw;

    font-weight:1000;

    letter-spacing:2px;

    text-transform:uppercase;

    line-height:1.15;

    color:#fff4f8;

    -webkit-text-stroke:
        2px #8c2766;

    text-stroke:
        2px #8c2766;

    text-shadow:

        0 0 10px
        rgba(255,255,255,.7),

        0 0 20px
        rgba(255,157,205,.8),

        0 0 35px
        rgba(126,40,107,.6),

        3px 3px 6px
        rgba(0,0,0,.4);

    z-index:50;
}


/* =========================================================
   TOP + BOTTOM MARQUEES
========================================================= */

.marquee{

    position:absolute;

    width:100%;

    overflow:hidden;

    z-index:15;
}

.marquee.top{
    top:16vh;
}

.marquee.bottom{
    bottom:10vh;
}

.track{

    display:flex;

    width:max-content;

    animation:
        scroll 90s linear infinite;
}

.track span{

    margin-right:8vw;

    font-size:3vw;

    color:#fff4f8;

    text-transform:uppercase;

    font-weight:700;

    letter-spacing:3px;

    white-space:nowrap;

    text-shadow:
        0 0 12px
        rgba(126,40,107,.65);
}

@keyframes scroll{

    from{
        transform:translateX(0);
    }

    to{
        transform:translateX(-50%);
    }

}


/* =========================================================
   CENTRE WELCOME
========================================================= */

.center-wrap{

    position:absolute;

    top:50%;
    left:50%;

    transform:
        translate(-50%,-50%);

    z-index:20;

    text-align:center;

    width:100vw;

    overflow:visible;
}



.main-text{

    position:relative;

    font-size:13.5vw;

    font-weight:900;

    text-transform:uppercase;

    line-height:1;

    white-space:nowrap;

    display:inline-block;

    z-index:10;

    background:linear-gradient(

        70deg,

        #a23b72,

        #d85c9c,

        #f2a7c6,

        #d85c9c,

        #f7d9e6,

        #fff4f8,

        #f7d9e6,

        #a23b72,

        #d7a8d8,

        #d85c9c

    );

    background-size:300% 100%;

    -webkit-background-clip:text;

    background-clip:text;

    -webkit-text-fill-color:transparent;

    animation:

        pulse 4s ease-in-out infinite,

        hue 12s linear infinite;

    filter:
        drop-shadow(
            0 0 25px
            #6b245d
        );
}


@keyframes pulse{

    0%,
    100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.04);
    }

}


@keyframes hue{

    from{
        background-position:0% 50%;
    }

    to{
        background-position:300% 50%;
    }

}


/* =========================================================
   FLOATING LIGHT SHAPES
========================================================= */

.shape{

    position:absolute;

    border-radius:50%;

    filter:blur(8px);

    opacity:.45;

    z-index:4;

    mix-blend-mode:screen;
}


.s1{

    width:16vw;
    height:16vw;

    background:
        radial-gradient(
            circle,
            #ffb6d5,
            transparent 70%
        );

    top:22%;
    left:12%;

    animation:
        float1 14s ease-in-out infinite;
}


.s2{

    width:20vw;
    height:20vw;

    background:
        radial-gradient(
            circle,
            #d48ac2,
            transparent 70%
        );

    bottom:15%;
    right:10%;

    animation:
        float2 18s ease-in-out infinite;
}


.s3{

    width:12vw;
    height:12vw;

    background:
        radial-gradient(
            circle,
            #f8d8e8,
            transparent 70%
        );

    top:28%;
    right:22%;

    animation:
        float3 12s ease-in-out infinite;
}


.s4{

    width:15vw;
    height:15vw;

    background:
        radial-gradient(
            circle,
            #fff0c9,
            transparent 70%
        );

    bottom:20%;
    left:8%;

    animation:
        float2 20s ease-in-out infinite reverse;
}


@keyframes float1{

    0%,
    100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-5vh);
    }

}


@keyframes float2{

    0%,
    100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(5vh);
    }

}


@keyframes float3{

    0%,
    100%{
        transform:translateX(0);
    }

    50%{
        transform:translateX(-5vw);
    }

}


/* =========================================================
   STATIC FOOTER
========================================================= */

.footer{

    position:absolute;

    bottom:3vh;

    width:100%;

    text-align:center;

    font-size:2.5vw;

    font-weight:600;

    letter-spacing:2px;

    color:#fff4f8;

    z-index:40;

    text-shadow:
        0 0 12px
        rgba(110,25,83,.8);

    /* IMPORTANT:
       NO ANIMATION ON FOOTER */
}


/* =========================================================
   RESPONSIVE DESIGN
========================================================= */

@media(max-width:900px){

    .header{

        top:1vh;
        left:1.5vw;

        gap:8px;
    }

    .logo-flower-frame{

        width:125px;
        height:110px;
    }

    .logo{

        width:90px;
        height:75px;
    }

    .logo-flower{

        font-size:20px;
    }

    .name{

        font-size:4vw;

        letter-spacing:1px;

        max-width:
            calc(100vw - 140px);
    }

    .track span{

        font-size:4vw;
    }

    .footer{

        font-size:3vw;
    }

}


/* =========================================================
   SOFT RANDOM BLUR ANIMATION
========================================================= */

</style>

</head>


<body>


<!-- ======================================================
     CENTRAL GLOW
====================================================== -->

<div class="glow"></div>


<!-- ======================================================
     LARGE BACKGROUND FLOWERS
====================================================== -->

<div class="bg-flower f1">🌸</div>

<div class="bg-flower f2">🌺</div>

<div class="bg-flower f3">🌷</div>

<div class="bg-flower f4">🌸</div>


<!-- ======================================================

====================================================== -->

<div class="petal petal1">🌸</div>
<div class="petal petal2">🌺</div>
<div class="petal petal3">🌷</div>
<div class="petal petal4">🌸</div>
<div class="petal petal5">🌺</div>
<div class="petal petal6">🌷</div>
<div class="petal petal7">🌸</div>
<div class="petal petal8">🌺</div>


<!-- ======================================================
     SEAMLESS BACKGROUND SCROLLING THANK YOU
====================================================== -->

<div class="bg-scroll">

    <div class="bg-scroll-track">

        <span>
            WELCOMING&nbsp;&nbsp;
            WELCOMING&nbsp;&nbsp;
            WELCOMING&nbsp;&nbsp;
            WELCOMING&nbsp;&nbsp;
            WELCOMING&nbsp;&nbsp;
            WELCOMING&nbsp;&nbsp;
        </span>

        <span>
            WELCOMING&nbsp;&nbsp;
            WELCOMING&nbsp;&nbsp;
            WELCOMING&nbsp;&nbsp;
            WELCOMING&nbsp;&nbsp;
            WELCOMING&nbsp;&nbsp;
            WELCOMING&nbsp;&nbsp;
        </span>

    </div>

</div>


<!-- ======================================================
     HEADER
     LOGO + FLOWERS + CHURCH NAME
====================================================== -->

<div class="header">


    <!-- LOGO FLOWER FRAME -->

    <div class="logo-flower-frame">


        <!-- FLOWERS AROUND LOGO -->

        <div class="logo-flower flower1">
            🌸
        </div>

        <div class="logo-flower flower2">
            🌺
        </div>

        <div class="logo-flower flower3">
            🌷
        </div>

        <div class="logo-flower flower4">

        </div>

        </div>

        <div class="logo-sparkle spark1">

        </div>

        <!-- CHURCH LOGO -->

        <img
            src="logo.png"
            class="logo"

            onerror="this.style.display='none'"
        >

    <div class="name">

    </div>

====================================================== -->

    <div class="main-text">

    </div>

====================================================== -->

<div class="shape s2"></div>

<script>

/* =========================================================
   SOFT RANDOM BLUR ANIMATION
========================================================= */

const shapes =
    document.querySelectorAll('.shape');

setInterval(()=>{

    shapes.forEach(shape=>{

        shape.style.filter =
            `blur(${5 + Math.random()*8}px)`;

    });

},2500);


/* =========================================================
   RANDOM SPARKLE SIZE
========================================================= */

const sparkles =
    document.querySelectorAll('.logo-sparkle');

setInterval(()=>{

    sparkles.forEach(sparkle=>{

        const size =
            0.8 + Math.random() * 0.8;

        sparkle.style.transform =
            `scale(${size})`;

    });

},1800);

</script>


</body>
